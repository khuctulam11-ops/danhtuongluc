<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Danh Tướng Lục</title>
<meta name="theme-color" content="#160f0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#160f0b;--bg2:#21170f;--card:#2b1f15;--line:#4a3523;--gold:#e8c45a;--gold2:#b8902e;--txt:#f3e7d3;--mut:#a8977f;--red:#d9483b;--grn:#4fb06a;--r0:#9a9a9a;--r1:#4a90d9;--r2:#a65ad9;--r3:#f0b030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--txt);background:#120c08;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--gold2)}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.btn{background:linear-gradient(#f0d27a,#c49431);color:#2a1a08;font-weight:800;padding:12px 16px;border-radius:12px;box-shadow:0 3px 0 #7a5a18}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a18}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.btn2{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:600}
.btn2:active{background:#3a2a1c}
.red{background:linear-gradient(#e86a5a,#a8302a);color:#fff;box-shadow:0 3px 0 #5e1712}
.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
h2{margin:4px 0 8px;font-size:18px;color:var(--gold)}
h3{margin:2px 0 6px;font-size:15px}
/* Đăng nhập */
#scrLogin{background:radial-gradient(ellipse at 50% 20%,#4a2a14,var(--bg) 70%);align-items:center;justify-content:center;padding:20px;overflow:auto}
.logo{font-size:38px;font-weight:800;letter-spacing:1px;text-align:center;background:linear-gradient(#fff2c0,#e8c45a 50%,#9a6a1a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 20px rgba(232,196,90,.25);margin-bottom:4px}
.box{width:100%;max-width:360px}
.tabs{display:flex;background:#120c08;border-radius:12px;padding:4px;margin:14px 0}
.tabs button{flex:1;padding:10px;border-radius:9px;background:none;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--card);color:var(--gold)}
.msg{min-height:20px;font-size:13px;color:#ff8a7a;text-align:center}
/* Khung chính */
header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#2b1d12,#1c140d);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header .nm{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:#120c08;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#1c140d;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:8px 2px 9px;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--gold)}
/* Tướng */
.lineup{display:flex;justify-content:space-around;align-items:flex-end;background:radial-gradient(ellipse at 50% 90%,#5a3a1c 0,transparent 70%);border-radius:14px;padding:6px 0 0;min-height:150px}
.lu{width:31%;text-align:center}
.fg{display:flex;justify-content:center}.fg svg{height:100%;width:auto}
.lu .fg{height:118px}
.lu .fg svg{height:100%;width:auto}
.lu .n{font-size:12px;font-weight:600}
.lu.empty .fg{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:30px;border:2px dashed var(--line);border-radius:12px;height:100px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 4px 6px;text-align:center;position:relative}
.hc .fg{height:88px}.hc .fg svg{height:100%}
.hc .n{font-size:11.5px;font-weight:700;line-height:1.2;min-height:28px;display:flex;align-items:center;justify-content:center}
.hc .s{font-size:11px;color:var(--mut)}
.hc .tag{position:absolute;top:4px;left:4px;background:var(--gold);color:#2a1a08;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
.r0{border-color:var(--r0)!important}.r1{border-color:var(--r1)!important}.r2{border-color:var(--r2)!important}.r3{border-color:var(--r3)!important;box-shadow:0 0 12px rgba(240,176,48,.35)}
.t0{color:var(--r0)}.t1{color:var(--r1)}.t2{color:var(--r2)}.t3{color:var(--r3)}
.star{color:#ffd34a;letter-spacing:-1px}
/* Bảng */
.lr{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
.lr:last-child{border:0}
.lr .rk{width:30px;text-align:center;font-weight:800;color:var(--mut)}
.lr .rk.top{color:var(--gold);font-size:18px}
.lr .who{flex:1;min-width:0}
.lr .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr.me{background:rgba(232,196,90,.1);border-radius:10px}
/* Hộp thoại */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#modal .mb{background:var(--bg2);border:1px solid var(--gold2);border-radius:16px;padding:16px;width:100%;max-width:400px;max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#000c;border:1px solid var(--gold2);padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90%;text-align:center;font-weight:600}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:70}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Chiến đấu */
#scrBattle{background:linear-gradient(#2a3a4a 0,#46525a 30%,#6b5a3a 31%,#4a3a22 100%)}
.bh{padding:calc(8px + env(safe-area-inset-top)) 12px 6px;display:flex;align-items:center;gap:8px;background:#0008}
.bh .t{flex:1;font-weight:800}
#field{position:relative;flex:1;overflow:hidden}
.unit{position:absolute;width:30%;transition:opacity .4s}
.unit .hd{font-size:11px;font-weight:700;text-align:center;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#0009;border-radius:4px;overflow:hidden;margin:2px 8%}
.bar i{display:block;height:100%;background:linear-gradient(#7ee08a,#2f9a48);transition:width .3s}
.foe .bar i{background:linear-gradient(#f08a7a,#b8382a)}
.bar.rg{height:4px}.bar.rg i{background:linear-gradient(#ffe27a,#e0a020)!important}
.unit .fig{height:min(17vh,130px);display:flex;justify-content:center}
.unit .fig .body{height:100%;transition:transform .16s ease-out;animation:breath 2.4s ease-in-out infinite}
.unit .fig svg{height:100%;width:auto;overflow:visible}
.foe .fig{transform:scaleX(-1)}
.unit.lunge .fig .body{transform:translateX(45%);animation:none}
.unit.hit .fig .body{animation:shake .25s}
.unit.hit .fig svg{filter:brightness(1.8) sepia(1) hue-rotate(-40deg) saturate(4)}
.unit.act .hd{color:var(--gold)}
.unit.act::after{content:'';position:absolute;left:25%;right:25%;bottom:-4px;height:8px;border-radius:50%;background:radial-gradient(var(--gold),transparent 70%)}
.unit.tgt::before{content:'▼';position:absolute;left:50%;top:-20px;margin-left:-9px;color:#ff4a3a;font-size:20px;text-shadow:0 0 6px #000;animation:bob .5s infinite alternate;z-index:3}
.unit.dead{opacity:.15}
@keyframes breath{50%{transform:translateY(-2px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{to{transform:translateY(6px)}}
.fl{position:absolute;font-weight:800;font-size:20px;text-shadow:0 2px 3px #000,0 0 2px #000;pointer-events:none;animation:fl 1s ease-out forwards;z-index:5;white-space:nowrap}
.fl.cr{font-size:26px;color:#ffd34a}
.fl.hl{color:#7ef08a}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-55px) scale(1);opacity:0}}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:28px;font-weight:800;color:var(--gold);text-shadow:0 0 18px #f80,0 3px 4px #000;opacity:0;pointer-events:none;z-index:6}
#banner.on{animation:bn 1.1s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(2)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#ctrl{background:#000a;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#ctrl .who{font-size:13px;color:var(--gold);text-align:center;min-height:18px}
.slash{position:absolute;width:30%;height:16vh;pointer-events:none;z-index:4;background:linear-gradient(115deg,transparent 42%,#fff 49%,#ffe9a0 51%,transparent 58%);animation:sl .3s ease-out forwards}
@keyframes sl{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:0;clip-path:inset(0 0 0 0)}}
.gres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gres .hc .fg{height:62px}
.gres .hc .n{font-size:10px;min-height:24px}
.flip{animation:flp .5s backwards}
@keyframes flp{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:8px;font-size:11px;padding:1px 6px;font-weight:700}
.adm{border-color:#7a3a3a}
</style>
</head>

<div id="loading"><div class="logo">Danh Tướng Lục</div><div class="spin"></div><div class="mut" id="loadTxt">Đang kết nối...</div></div>

</div>
</section>
<section class="scr" id="scrMain">
<header>
<div class="nm" id="hName"></div>
<span class="pill">⚔ <b id="hPow">0</b></span>

<div id="view"></div>

</nav>
</section>
<section class="scr" id="scrBattle">
<div class="bh"><div class="t" id="bTitle"></div><span class="pill" id="bRound">Lượt 1</span></div>
<div id="field"><div id="banner"></div></div>
<div id="ctrl">
<div class="who" id="cWho"></div>
<div class="row">
<button class="btn" style="flex:1" id="cAtk">⚔ Đánh</button>
<button class="btn red" style="flex:1.4" id="cSkill">🔥 Tuyệt kỹ</button>
</div>
<div class="row">
<button class="btn2" style="flex:1" id="cAuto">🤖 Tự đánh: Tắt</button>
<button class="btn2" style="flex:1" id="cSpeed">⏩ Tốc độ x1</button>
</div>
</div>
</section>
<div id="modal"><div class="mb" id="mb"></div></div>

async function makeFirebase(){
const [{initializeApp},A,F]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
const app=initializeApp(CFG),auth=A.getAuth(app),db=F.getFirestore(app);
const pd=uid=>F.doc(db,'players',uid);
return{
onAuth:cb=>A.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid}:null)),
register:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p).then(c=>({uid:c.user.uid})),
login:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
logout:()=>A.signOut(auth),
changePw:async(oldP,newP)=>{const u=auth.currentUser;await A.reauthenticateWithCredential(u,A.EmailAuthProvider.credential(u.email,oldP));await A.updatePassword(u,newP)},
getPlayer:async uid=>{const s=await F.getDoc(pd(uid));return s.exists()?s.data():null},
createPlayer:(uid,d)=>F.setDoc(pd(uid),d),
savePlayer:(uid,d)=>F.setDoc(pd(uid),d,{merge:true}),
watchPlayer:(uid,cb)=>F.onSnapshot(pd(uid),s=>cb(s.exists()?s.data():null),e=>console.warn(e)),
top:async n=>(await F.getDocs(F.query(F.collection(db,'players'),F.orderBy('power','desc'),F.limit(n)))).docs.map(d=>({uid:d.id,...d.data()})),
addBattle:d=>F.addDoc(F.collection(db,'battles'),{...d,at:F.serverTimestamp()}),
defLog:async uid=>(await F.getDocs(F.query(F.collection(db,'battles'),F.where('defender','==',uid),F.limit(40)))).docs.map(d=>d.data()),
notices:async()=>(await F.getDocs(F.query(F.collection(db,'notices'),F.orderBy('ms','desc'),F.limit(5)))).docs.map(d=>({id:d.id,...d.data()})),
isAdmin:async uid=>{try{return(await F.getDoc(F.doc(db,'admins',uid))).exists()}catch(e){return false}},
setBan:(uid,b)=>F.updateDoc(pd(uid),{banned:b}),
gift:(uid,g,m)=>F.updateDoc(pd(uid),{pendingGold:F.increment(g),pendingGem:F.increment(m)}),
delPlayer:uid=>F.deleteDoc(pd(uid)),
addNotice:t=>F.addDoc(F.collection(db,'notices'),{text:t,ms:Date.now()}),
delNotice:id=>F.deleteDoc(F.doc(db,'notices',id)),
};
}
function makeMock(){ // chế độ thử: lưu trên máy, không cần mạng
const L=()=>JSON.parse(localStorage.getItem('dtlmock')||'null')||{users:{},players:{},battles:[],notices:[{id:'n1',text:'Chào mừng đến Danh Tướng Lục (bản thử)!',ms:Date.now()}],admins:{}};
const S=d=>localStorage.setItem('dtlmock',JSON.stringify(d));
let d=L();
if(!Object.keys(d.players).length){ // người chơi mẫu
[['Tào Tháo','tt',['qtrung','ttrac','ykieu'],12],['Kiếm Khách','kk',['thd','btrieu','cungthu'],8],['Tiểu Long','tl',['nquyen','lelai','vebinh'],4]].forEach(([n,u,l,lv],i)=>{
const heroes={};l.forEach(k=>heroes[k]={lv,star:1});const p={name:n,user:u,banned:false,heroes,lineup:l,stage:lv,wins:i,losses:1,gold:0,gem:0};p.power=calcPow(p);d.players['m'+i]=p});S(d)}
let cur=JSON.parse(localStorage.getItem('dtlmockcur')||'null'),authCb;
const fire=()=>authCb&&authCb(cur);
const err=c=>{const e=new Error(c);e.code=c;return e};
return{
onAuth:cb=>{authCb=cb;setTimeout(fire,200)},
register:async(e,p)=>{d=L();if(d.users[e])throw err('auth/email-already-in-use');const uid='u'+Date.now();d.users[e]={p,uid};if(!Object.keys(d.admins).length)d.admins[uid]=1;S(d);cur={uid};localStorage.setItem('dtlmockcur',JSON.stringify(cur));setTimeout(fire,50);return{uid}},
login:async(e,p)=>{d=L();const u=d.users[e];if(!u||u.p!==p)throw err('auth/invalid-credential');cur={uid:u.uid};localStorage.setItem('dtlmockcur',JSON.stringify(cur));fire()},
logout:async()=>{cur=null;localStorage.removeItem('dtlmockcur');fire()},
changePw:async()=>{},
getPlayer:async uid=>{d=L();return d.players[uid]||null},
createPlayer:async(uid,p)=>{d=L();d.players[uid]=p;S(d)},
savePlayer:async(uid,p)=>{d=L();d.players[uid]={...d.players[uid],...p};S(d)},
watchPlayer:(uid,cb)=>{setTimeout(()=>{d=L();cb(d.players[uid])},300);return()=>{}},
top:async n=>{d=L();return Object.entries(d.players).map(([uid,p])=>({uid,...p})).sort((a,b)=>b.power-a.power).slice(0,n)},
addBattle:async b=>{d=L();d.battles.push({...b,ms:Date.now()});S(d)},
defLog:async uid=>{d=L();return d.battles.filter(b=>b.defender===uid)},
notices:async()=>{d=L();return d.notices.slice().sort((a,b)=>b.ms-a.ms).slice(0,5)},
isAdmin:async uid=>{d=L();return!!d.admins[uid]},
setBan:async(uid,b)=>{d=L();d.players[uid].banned=b;S(d)},
gift:async(uid,g,m)=>{d=L();const p=d.players[uid];p.pendingGold=(p.pendingGold||0)+g;p.pendingGem=(p.pendingGem||0)+m;S(d)},
delPlayer:async uid=>{d=L();delete d.players[uid];S(d)},
addNotice:async t=>{d=L();d.notices.push({id:'n'+Date.now(),text:t,ms:Date.now()});S(d)},
delNotice:async id=>{d=L();d.notices=d.notices.filter(n=>n.id!==id);S(d)},
};
}

V(`<div class="card" style="text-align:center;background:radial-gradient(ellipse at 50% 30%,#5a3414,var(--card))">
<h2>🎴 Chiêu Mộ Danh Tướng</h2>
<div class="fg" style="height:150px">${heroSVG(pick(['llq','adv','tgiong','thd','qtrung']))}</div>
<div class="mut">Tỉ lệ: <span class="t3">Huyền thoại 3%</span> · <span class="t2">Sử thi 12%</span> · <span class="t1">Hiếm 30%</span> · <span class="t0">Thường 55%</span></div>
<div class="mut" style="margin-top:4px">Trùng tướng: tướng được +1 sao (tối đa 5 sao)</div>
<div class="row" style="margin-top:12px"><button class="btn2" style="flex:1" id="g1">Chiêu 1 lần<br><b>💎 100</b></button><button class="btn" style="flex:1" id="g10">Chiêu 10 lần<br>💎 900</button></div>
</div>
<h3 style="margin-top:14px">Danh sách tướng có thể chiêu mộ</h3>
<div class="grid">${POOL.slice().sort((a,b)=>H[b].r-H[a].r).map(k=>`<div class="hc r${H[k].r}" style="${P.heroes[k]?'':'opacity:.55'}"><div class="fg">${heroSVG(k)}</div><div class="n t${H[k].r}">${esc(H[k].n)}</div><div class="s">${P.heroes[k]?'Đã có':'Chưa có'}</div></div>`).join('')}</div>`);

/* ---------- CHIẾN ĐẤU ---------- */
async chiendau(){
if(P.chDay!==today()){P.chDay=today();P.chCount=0}
const left=10-P.chCount;
V(`<div class="card"><h2>🗺 Chinh Phạt – Ải ${P.stage}</h2>
<div class="mut">Đánh bại quân giặc để mở ải mới. Qua ải lần đầu nhận ngọc, mỗi 5 ải có thủ lĩnh và thưởng lớn.</div>
<div class="row" style="margin-top:10px"><button class="btn" style="flex:2" id="bStage">⚔ Đánh ải ${P.stage}${P.stage%5===0?' (Thủ lĩnh)':''}</button>${P.stage>1?`<button class="btn2" style="flex:1" id="bFarm">Đánh lại ải ${P.stage-1}<br><span class="mut">kiếm vàng</span></button>`:''}</div></div>
<div class="card" style="margin-top:10px"><h2>🏹 Khiêu Chiến</h2><div class="mut">Hôm nay còn <b style="color:var(--gold)">${left}</b>/10 lượt. Thắng: +150 vàng, +20 ngọc.</div><div id="opp" style="margin-top:8px" class="mut">Đang tìm đối thủ...</div></div>`);
$('#bStage').onclick=()=>fightStage(P.stage);if(P.stage>1)$('#bFarm').onclick=()=>fightStage(P.stage-1);
try{
const all=(await api.top(100)).filter(x=>x.uid!==UID&&!x.banned&&x.lineup&&x.lineup.length);
all.sort((a,b)=>Math.abs(a.power-P.power)-Math.abs(b.power-P.power));
const e=$('#opp');if(!e)return;
e.innerHTML=all.length?all.slice(0,8).sort((a,b)=>b.power-a.power).map(o=>`<div class="lr"><div class="who"><b>${esc(o.name)}</b><span class="mut">⚔ ${fmt(o.power)} · Thắng ${o.wins||0}</span></div><button class="btn" data-u="${o.uid}" ${left>0?'':'disabled'}>Khiêu chiến</button></div>`).join(''):'Chưa có người chơi khác. Rủ bạn bè vào chơi nhé!';
e.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>challenge(all.find(o=>o.uid===b.dataset.u)));
}catch(err){const e=$('#opp');if(e)e.textContent='Không tải được danh sách đối thủ.'}
},
/* ---------- XẾP HẠNG ---------- */
async xephang(){
V(`<h2>🏆 Bảng Xếp Hạng Lực Chiến</h2><div class="card" id="lb"><div class="mut">Đang tải...</div></div>`);
try{
const all=(await api.top(60)).filter(x=>!x.banned).slice(0,50);
$('#lb').innerHTML=all.map((o,i)=>`<div class="lr ${o.uid===UID?'me':''}" data-u="${o.uid}"><div class="rk ${i<3?'top':''}">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="who"><b>${esc(o.name)}${o.uid===UID?' (bạn)':''}</b><span class="mut">Ải ${o.stage||1} · Thắng ${o.wins||0}</span></div><div style="font-weight:800;color:var(--gold)">⚔ ${fmt(o.power)}</div></div>`).join('')||'<div class="mut">Chưa có ai.</div>';

/* ---------- QUẢN LÝ ---------- */

document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
V(`<h2>👑 Trang Quản Lý</h2>
<div class="card adm"><h3>📢 Gửi thông báo</h3><textarea id="aTxt" rows="2" placeholder="Nội dung thông báo cho mọi người chơi"></textarea><button class="btn full" style="margin-top:8px" id="aSend">Gửi thông báo</button><div id="aN" style="margin-top:8px"></div></div>
<div class="card adm" style="margin-top:10px"><h3>👥 Người chơi <span id="aCnt" class="mut"></span></h3><input id="aQ" placeholder="Tìm theo tên nhân vật hoặc tên đăng nhập"><div id="aL" style="margin-top:8px" class="mut">Đang tải...</div></div>`);
const loadN=async()=>{const ns=await api.notices();$('#aN').innerHTML=ns.map(n=>`<div class="lr"><div class="who" style="white-space:normal">${esc(n.text)}</div><button class="btn2" data-n="${n.id}">Xóa</button></div>`).join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=async()=>{await api.delNotice(b.dataset.n);loadN()})};
$('#aSend').onclick=async()=>{const t=$('#aTxt').value.trim();if(!t)return;await api.addNotice(t);$('#aTxt').value='';toast('Đã gửi thông báo');loadN()};
loadN().catch(()=>{});
let all=[];
const render=()=>{const q=$('#aQ').value.trim().toLowerCase();const ls=all.filter(o=>!q||(o.name||'').toLowerCase().includes(q)||(o.user||'').includes(q));
$('#aCnt').textContent='('+all.length+')';
$('#aL').innerHTML=ls.map(o=>`<div class="lr" style="flex-wrap:wrap"><div class="who"><b>${esc(o.name)} ${o.banned?'<span class="badge">Bị khóa</span>':''}</b><span class="mut">@${esc(o.user||'?')} · ⚔ ${fmt(o.power)} · 💰${fmt(o.gold||0)} · 💎${fmt(o.gem||0)} · Ải ${o.stage||1}</span></div>
<div class="row" style="width:100%"><button class="btn2" style="flex:1" data-g="${o.uid}">🎁 Tặng</button><button class="btn2" style="flex:1" data-b="${o.uid}">${o.banned?'🔓 Mở khóa':'🔒 Khóa'}</button><button class="btn2" style="flex:1" data-d="${o.uid}">🗑 Xóa</button></div></div>`).join('')||'Không có ai.';
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const o=all.find(x=>x.uid===b.dataset.g);modal(`<h2>🎁 Tặng quà cho ${esc(o.name)}</h2><div class="col"><input id="gG" type="number" inputmode="numeric" placeholder="Số vàng"><input id="gM" type="number" inputmode="numeric" placeholder="Số ngọc"><button class="btn" id="gOk">Tặng</button><button class="btn2" onclick="document.getElementById('modal').classList.remove('on')">Hủy</button></div>`);$('#gOk').onclick=async()=>{const g=Math.max(0,parseInt($('#gG').value)||0),m=Math.max(0,parseInt($('#gM').value)||0);if(!g&&!m)return;await api.gift(o.uid,g,m);closeModal();toast('Đã tặng! Người chơi nhận khi vào game')}});
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{const o=all.find(x=>x.uid===b.dataset.b);if(o.uid===UID)return toast('Không thể tự khóa mình');await api.setBan(o.uid,!o.banned);o.banned=!o.banned;toast(o.banned?'Đã khóa':'Đã mở khóa');render()});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const o=all.find(x=>x.uid===b.dataset.d);modal(`<h2>Xóa dữ liệu ${esc(o.name)}?</h2><p class="mut">Toàn bộ tướng, vàng, ngọc của người này bị xóa. Họ vẫn đăng nhập được nhưng phải chơi lại từ đầu. Muốn chặn hẳn thì dùng nút Khóa.</p><div class="row"><button class="btn red" style="flex:1" id="dOk">Xóa</button><button class="btn2" style="flex:1" onclick="document.getElementById('modal').classList.remove('on')">Hủy</button></div>`);$('#dOk').onclick=async()=>{await api.delPlayer(o.uid);all=all.filter(x=>x!==o);closeModal();render();toast('Đã xóa')}});
};
$('#aQ').oninput=render;
try{all=await api.top(500);render()}catch(e){$('#aL').textContent='Không tải được: '+(e.code||e.message)}
},
};
/* ---------- Chi tiết tướng ---------- */
function heroDetail(k){
const h=H[k],o=P.heroes[k],s=stats(k,o.lv,o.star),inL=P.lineup.includes(k),cost=o.lv*120,maxed=o.lv>=60;
const nx=stats(k,o.lv+1,o.star);
modal(`<div style="text-align:center"><div class="fg" style="height:170px">${heroSVG(k)}</div><h2 class="t${h.r}" style="margin:0">${esc(h.n)}</h2><div class="mut">${RN[h.r]} · Cấp ${o.lv} · ${stars(o.star)}</div></div>
<div class="card" style="margin:10px 0;font-size:14px"><div class="row" style="justify-content:space-between"><span>❤ Máu</span><b>${fmt(s.hp)} <span class="mut">→ ${fmt(nx.hp)}</span></b></div><div class="row" style="justify-content:space-between"><span>⚔ Tấn công</span><b>${fmt(s.atk)} <span class="mut">→ ${fmt(nx.atk)}</span></b></div><div class="row" style="justify-content:space-between"><span>🛡 Phòng thủ</span><b>${fmt(s.def)} <span class="mut">→ ${fmt(nx.def)}</span></b></div><div class="row" style="justify-content:space-between"><span>💨 Tốc độ</span><b>${s.spd}</b></div>
<div style="margin-top:8px"><b style="color:var(--gold)">🔥 ${esc(h.sk)}</b><div class="mut">${SKD[h.w]}${h.heal?', đồng thời hồi máu cả đội':''}</div></div></div>
<div class="col"><button class="btn" id="hUp" ${maxed||P.gold<cost?'disabled':''}>${maxed?'Đã đạt cấp tối đa':'⬆ Nâng cấp – 💰 '+fmt(cost)}</button>
<button class="btn2" id="hLine">${inL?'⬇ Cho xuống trận':'⬆ Cho lên trận'}</button>
<button class="btn2" onclick="document.getElementById('modal').classList.remove('on')">Đóng</button></div>`);
$('#hUp').onclick=()=>{if(P.gold<cost)return;P.gold-=cost;o.lv++;save();heroDetail(k);if(curView==='tuong')VIEWS.tuong()};
$('#hLine').onclick=()=>{
if(inL){if(P.lineup.length<=1)return toast('Đội hình cần ít nhất 1 tướng');P.lineup=P.lineup.filter(x=>x!==k)}
else{if(P.lineup.length>=3){closeModal();return pickReplace(k)}P.lineup.push(k)}
save();closeModal();VIEWS.tuong();
};
}
function pickReplace(k){
modal(`<h2>Thay tướng nào?</h2><div class="mut">Đội hình đã đủ 3 tướng. Chọn tướng muốn đổi ra:</div><div class="grid" style="margin-top:10px">${P.lineup.map(x=>`<div class="hc r${H[x].r}" data-x="${x}"><div class="fg">${heroSVG(x)}</div><div class="n">${esc(H[x].n)}</div></div>`).join('')}</div><button class="btn2 full" style="margin-top:10px" onclick="document.getElementById('modal').classList.remove('on')">Hủy</button>`);
document.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{P.lineup[P.lineup.indexOf(e.dataset.x)]=k;save();closeModal();VIEWS.tuong()});
}
/* ---------- Chiêu mộ ---------- */
function roll(){const r=Math.random();const rar=r<.03?3:r<.15?2:r<.45?1:0;return pick(POOL.filter(k=>H[k].r===rar))}
function gacha(n){
const cost=n===10?900:100;if(P.gem<cost)return toast('Không đủ ngọc! Đánh ải và nhận quà hằng ngày để có thêm ngọc');
P.gem-=cost;const res=[];
for(let i=0;i<n;i++){let k=roll();if(n===10&&i===9&&!res.some(x=>H[x.k].r>=2)){k=pick(POOL.filter(x=>H[x].r===2))}
let note;if(!P.heroes[k]){P.heroes[k]={lv:1,star:1};note='MỚI'}else if(P.heroes[k].star<5){P.heroes[k].star++;note='+1 sao'}else{P.gold+=300;note='+300 vàng'}
res.push({k,note})}
save(true);
const best=Math.max(...res.map(x=>H[x.k].r));
modal(`<h2 style="text-align:center">${best===3?'🌟 HUYỀN THOẠI! 🌟':'Kết quả chiêu mộ'}</h2><div class="${n===10?'gres':'grid'}" style="${n===1?'grid-template-columns:1fr;max-width:160px;margin:auto':''}">${res.map((x,i)=>`<div class="hc r${H[x.k].r} flip" style="animation-delay:${i*.12}s"><span class="tag">${x.note}</span><div class="fg">${heroSVG(x.k)}</div><div class="n t${H[x.k].r}">${esc(H[x.k].n)}</div></div>`).join('')}</div>
<div class="row" style="margin-top:12px"><button class="btn2" style="flex:1" id="gAgain">Chiêu tiếp</button><button class="btn" style="flex:1" onclick="document.getElementById('modal').classList.remove('on')">Xong</button></div>`);
$('#gAgain').onclick=()=>{closeModal();gacha(n)};
VIEWS.chieumo();
}
/* ---------- Thẻ người chơi ---------- */
function playerCard(o){
const left=10-(P.chDay===today()?P.chCount:0);
modal(`<h2>${esc(o.name)}</h2><div class="mut">⚔ Lực chiến ${fmt(o.power)} · Ải ${o.stage||1} · Thắng ${o.wins||0} / Thua ${o.losses||0}</div>
<div class="lineup" style="margin:10px 0">${(o.lineup||[]).filter(k=>H[k]&&o.heroes&&o.heroes[k]).map(k=>`<div class="lu"><div class="fg">${heroSVG(k)}</div><div class="n t${H[k].r}">${esc(H[k].n)}</div><div class="mut" style="font-size:11px">Cấp ${o.heroes[k].lv} ${stars(o.heroes[k].star)}</div></div>`).join('')}</div>
<div class="col"><button class="btn" id="pcF" ${left>0?'':'disabled'}>⚔ Khiêu chiến (còn ${left} lượt)</button><button class="btn2" onclick="document.getElementById('modal').classList.remove('on')">Đóng</button></div>`);
$('#pcF').onclick=()=>{closeModal();challenge(o)};
}
/* ---------- Cài đặt ---------- */
function settings(){
modal(`<h2>⚙ Cài đặt</h2><div class="col">
<div class="mut">Tên đăng nhập: <b style="color:var(--txt)">${esc(P.user||'?')}</b></div>
<label class="mut">Đổi tên nhân vật</label><div class="row"><input id="sName" maxlength="14" value="${esc(P.name)}"><button class="btn" id="sNameOk">Lưu</button></div>
<label class="mut">Đổi mật khẩu</label><input id="sOld" type="password" placeholder="Mật khẩu cũ"><input id="sNew" type="password" placeholder="Mật khẩu mới (ít nhất 6 ký tự)"><button class="btn2" id="sPw">Đổi mật khẩu</button>
<label class="mut">Mã người chơi (dùng khi cấp quyền quản lý)</label><div class="row"><input id="sUid" readonly value="${esc(UID)}" style="font-size:12px"><button class="btn2" id="sCp">Chép</button></div>
<button class="btn red" id="sOut">Đăng xuất</button>
<button class="btn2" onclick="document.getElementById('modal').classList.remove('on')">Đóng</button></div>`);
$('#sNameOk').onclick=()=>{const n=$('#sName').value.trim();if(n.length<2)return toast('Tên ít nhất 2 ký tự');P.name=n;save(true);toast('Đã đổi tên');closeModal();go(curView==='admin'?'sanh':curView)};
$('#sPw').onclick=async()=>{const a=$('#sOld').value,b=$('#sNew').value;if(b.length<6)return toast('Mật khẩu mới ít nhất 6 ký tự');try{await api.changePw(a,b);toast('Đã đổi mật khẩu');closeModal()}catch(e){toast(authMsg(e.code))}};
$('#sCp').onclick=()=>{const i=$('#sUid');i.select();navigator.clipboard?.writeText(UID).then(()=>toast('Đã chép mã')).catch(()=>{document.execCommand('copy');toast('Đã chép mã')})};
$('#sOut').onclick=()=>{closeModal();api.logout()};
}
const POS=[{x:3,y:3},{x:17,y:35},{x:3,y:67}];
let B=null,AUTO=false,SPD=1;
try{AUTO=localStorage.getItem('dtlAuto')==='1';SPD=+localStorage.getItem('dtlSpd')||1}catch(e){}
function mkUnit(k,lv,star,side,i,mul=1){const s=stats(k,lv,star);return{k,h:H[k],side,i,maxHp:Math.round(s.hp*mul),hp:Math.round(s.hp*mul),atk:s.atk*mul,def:s.def*mul,spd:s.spd,rage:0,stun:0,alive:true}}
function teamOf(p){return(p.lineup||[]).filter(k=>p.heroes[k]&&H[k]).slice(0,3)}
function stageTeam(n){
const lv=Math.max(1,Math.round(n*1.5)),mul=1+.07*n,boss=n%5===0;
const types=['giac','giaccung','tuonggiac'];
return[0,1,2].map(i=>{const k=boss&&i===1?'thulinh':types[(i+n)%3];return mkUnit(k,lv,1,'foe',i,mul*(boss&&i===1?1.6:1))});
}
function fightStage(n){
const me=teamOf(P).map((k,i)=>mkUnit(k,P.heroes[k].lv,P.heroes[k].star,'me',i));
battle(`Ải ${n}${n%5===0?' – Thủ lĩnh':''}`,me,stageTeam(n),win=>{
let txt;
if(win){const g=60+n*15;P.gold+=g;txt=`+${fmt(g)} vàng`;if(n===P.stage){const gm=n%5===0?100:30;P.gem+=gm;P.stage++;txt+=`, +${gm} ngọc. Mở ải ${P.stage}!`}save(true)}
return txt||'Hãy nâng cấp tướng hoặc chiêu mộ thêm rồi thử lại!';
});
}
function challenge(o){
if(P.chDay!==today()){P.chDay=today();P.chCount=0}
if(P.chCount>=10)return toast('Hết lượt khiêu chiến hôm nay');
P.chCount++;save(true);
const me=teamOf(P).map((k,i)=>mkUnit(k,P.heroes[k].lv,P.heroes[k].star,'me',i));
const foe=teamOf(o).map((k,i)=>mkUnit(k,o.heroes[k].lv,o.heroes[k].star,'foe',i));
battle('Khiêu chiến: '+o.name,me,foe,win=>{
if(win){P.wins=(P.wins||0)+1;P.gold+=150;P.gem+=20}else P.losses=(P.losses||0)+1;
save(true);
api.addBattle({attacker:UID,attackerName:P.name,defender:o.uid,defenderName:o.name,win,ms:Date.now()}).catch(()=>{});
return win?'+150 vàng, +20 ngọc':'Thua rồi, nâng cấp tướng và thử lại!';
});
}
function uEl(u){return document.getElementById(`u-${u.side}-${u.i}`)}
function drawUnits(){
const f=$('#field');f.querySelectorAll('.unit,.fl,.slash').forEach(e=>e.remove());
[...B.me,...B.foe].forEach(u=>{
const p=POS[u.i],d=document.createElement('div');d.className='unit '+u.side;d.id=`u-${u.side}-${u.i}`;
d.style.top=p.y+'%';d.style[u.side==='me'?'left':'right']=p.x+'%';
d.innerHTML=`<div class="hd t${u.h.r}">${esc(u.h.n)}</div><div class="bar"><i style="width:100%"></i></div><div class="bar rg"><i style="width:0%"></i></div><div class="fig"><div class="body">${heroSVG(u.k)}</div></div>`;
if(u.side==='foe')d.onclick=()=>{if(u.alive){B.tgt=u;markTgt()}};
f.appendChild(d);
});
}
function upd(u){const e=uEl(u);if(!e)return;e.querySelector('.bar i').style.width=Math.max(0,u.hp/u.maxHp*100)+'%';e.querySelector('.rg i').style.width=u.rage+'%';e.classList.toggle('dead',!u.alive)}
function markTgt(){B.foe.forEach(u=>uEl(u).classList.toggle('tgt',u===B.tgt&&u.alive&&B.waiting))}
function floatTxt(u,t,cls=''){const e=uEl(u),f=$('#field');if(!e)return;const r=e.getBoundingClientRect(),fr=f.getBoundingClientRect();const d=document.createElement('div');d.className='fl '+cls;d.textContent=t;d.style.left=(r.left-fr.left+r.width/2-20)+'px';d.style.top=(r.top-fr.top+r.height*.35)+'px';f.appendChild(d);setTimeout(()=>d.remove(),1000)}
function slashAt(u){const e=uEl(u);if(!e)return;const s=document.createElement('div');s.className='slash';s.style.top=e.style.top;s.style[u.side==='me'?'left':'right']=e.style[u.side==='me'?'left':'right'];if(u.side==='me')s.style.transform='scaleX(-1)';$('#field').appendChild(s);setTimeout(()=>s.remove(),350)}
function swing(u){
const g=uEl(u)?.querySelector('.wp');if(!g)return;const t0=performance.now(),D=260/SPD;
const f=t=>{const p=Math.min(1,(t-t0)/D);const a=p<.3?22-47*(p/.3):p<.6?-25+150*((p-.3)/.3):125-103*((p-.6)/.4);g.setAttribute('transform',`rotate(${a})`);if(p<1)requestAnimationFrame(f);else g.setAttribute('transform','rotate(22)')};
requestAnimationFrame(f);
}
const W=ms=>sleep(ms/SPD);
function banner(t){const b=$('#banner');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on')}
function dmg(a,d,mul){let v=a.atk*mul*rnd(.9,1.1)*100/(100+d.def);const cr=Math.random()<.12;if(cr)v*=1.6;return{v:Math.max(1,Math.round(v)),cr}}
async function hitUnit(a,d,mul){
if(!d.alive)return;const{v,cr}=dmg(a,d,mul);d.hp-=v;d.rage=Math.min(100,d.rage+12);
const e=uEl(d);e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),250);slashAt(d);
floatTxt(d,(cr?'Bạo kích! ':'')+'-'+fmt(v),cr?'cr':'');
if(d.hp<=0){d.hp=0;d.alive=false}upd(d);
}
const alive=s=>s.filter(u=>u.alive);
function aiTarget(u){const en=alive(u.side==='me'?B.foe:B.me);return Math.random()<.6?en.reduce((a,b)=>a.hp<b.hp?a:b):pick(en)}
async function act(u,type,t){
const en=u.side==='me'?B.foe:B.me,fr=u.side==='me'?B.me:B.foe,e=uEl(u);
if(!t||!t.alive)t=aiTarget(u);
if(type==='skill'){
u.rage=0;upd(u);banner(u.h.sk);await W(500);
const lm=u.h.r===3?.3:0;e.classList.add('lunge');swing(u);await W(180);
switch(u.h.w){
case 'thuong':await hitUnit(u,t,2.4+lm);break;
case 'kiem':for(let i=0;i<3;i++){const ts=alive(en);if(!ts.length)break;swing(u);await hitUnit(u,pick(ts),1+lm);await W(220)}break;
case 'dao':for(const x of alive(en))await hitUnit(u,x,1.3+lm);break;
case 'cung':for(const x of alive(en))await hitUnit(u,x,1.05+lm);break;
case 'roi':for(const x of alive(en))await hitUnit(u,x,1.4+lm);break;
case 'bua':await hitUnit(u,t,2+lm);if(t.alive){t.stun=1;floatTxt(t,'Choáng!','cr')}break;
}
if(u.h.heal){await W(250);for(const x of alive(fr)){const h=Math.round(x.maxHp*u.h.heal);x.hp=Math.min(x.maxHp,x.hp+h);floatTxt(x,'+'+fmt(h),'hl');upd(x)}}
}else{
e.classList.add('lunge');swing(u);await W(150);await hitUnit(u,t,1);u.rage=Math.min(100,u.rage+25);upd(u);
}
await W(220);e.classList.remove('lunge');await W(200);
}
function askPlayer(u){
return new Promise(res=>{
B.waiting=true;B.resolve=res;
if(!B.tgt||!B.tgt.alive)B.tgt=alive(B.foe)[0];markTgt();
$('#cWho').textContent=`Lượt của ${u.h.n} – bấm vào địch để chọn mục tiêu`;
$('#cAtk').disabled=false;$('#cSkill').disabled=u.rage<100;$('#cSkill').textContent=u.rage>=100?'🔥 '+u.h.sk:`🔥 Tuyệt kỹ (nộ ${u.rage}%)`;
});
}
function endWait(v){if(!B||!B.waiting)return;B.waiting=false;markTgt();$('#cAtk').disabled=true;$('#cSkill').disabled=true;const r=B.resolve;B.resolve=null;r(v)}
$('#cAtk').onclick=()=>endWait({type:'atk',t:B.tgt});
$('#cSkill').onclick=()=>endWait({type:'skill',t:B.tgt});
const setCtl=()=>{$('#cAuto').textContent='🤖 Tự đánh: '+(AUTO?'Bật':'Tắt');$('#cSpeed').textContent='⏩ Tốc độ x'+SPD};
$('#cAuto').onclick=()=>{AUTO=!AUTO;try{localStorage.setItem('dtlAuto',AUTO?'1':'0')}catch(e){}setCtl();if(AUTO&&B&&B.waiting){const u=B.cur;endWait({type:u.rage>=100?'skill':'atk',t:null})}};
$('#cSpeed').onclick=()=>{SPD=SPD===1?2:SPD===2?3:1;try{localStorage.setItem('dtlSpd',SPD)}catch(e){}setCtl()};
async function battle(title,me,foe,onEnd){
if(!me.length)return toast('Đội hình trống! Vào mục Tướng để chọn tướng ra trận');
if(!foe.length)return toast('Đối thủ chưa có đội hình');
B={me,foe,tgt:null,waiting:false};show('scrBattle');$('#bTitle').textContent=title;setCtl();
$('#cAtk').disabled=true;$('#cSkill').disabled=true;$('#cWho').textContent='';
drawUnits();await W(600);banner('Khai chiến!');await W(900);
let win=null,round=0;
while(win===null){
round++;$('#bRound').textContent='Lượt '+round;
if(round>30){win=false;break}
const order=[...alive(me),...alive(foe)].sort((a,b)=>b.spd-a.spd+rnd(-3,3));
for(const u of order){
if(!u.alive)continue;
if(!alive(foe).length){win=true;break}if(!alive(me).length){win=false;break}
const e=uEl(u);e.classList.add('act');B.cur=u;
if(u.stun){u.stun--;floatTxt(u,'Choáng','');await W(500);e.classList.remove('act');continue}
let a;
if(u.side==='me'&&!AUTO)a=await askPlayer(u);
else{$('#cWho').textContent=u.side==='me'?`${u.h.n} tự ra đòn`:`${u.h.n} (địch) ra đòn`;await W(250);a={type:u.rage>=100?'skill':'atk',t:null}}
await act(u,a.type,a.t);e.classList.remove('act');
}
if(win===null){if(!alive(foe).length)win=true;else if(!alive(me).length)win=false}
}
$('#cWho').textContent='';
banner(win?'CHIẾN THẮNG!':'THẤT BẠI');await W(1200);
const txt=onEnd(win);
modal(`<h2 style="text-align:center;font-size:26px">${win?'🏆 Chiến thắng!':'💀 Thất bại'}</h2><p style="text-align:center">${esc(txt)}</p><button class="btn full" id="bBack">Tiếp tục</button>`);
$('#bBack').onclick=()=>{closeModal();B=null;show('scrMain');go(curView==='admin'?'sanh':curView)};
}
(async()=>{
try{api=TEST?makeMock():await makeFirebase()}
catch(e){$('#loadTxt').textContent='Không kết nối được máy chủ. Kiểm tra mạng rồi mở lại game.';return}
if(TEST)document.title+=' (thử)';
api.onAuth(onUser);
})();
</script>
</body>
