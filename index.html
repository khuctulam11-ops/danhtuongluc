<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Danh Tướng Lục</title>
<meta name="theme-color" content="#160f0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#160f0b;--bg2:#21170f;--card:#2b1f15;--line:#4a3523;--gold:#e8c45a;--gold2:#b8902e;--txt:#f3e7d3;--mut:#a8977f;--red:#d9483b;--grn:#4fb06a;--r0:#9a9a9a;--r1:#4a90d9;--r2:#a65ad9;--r3:#f0b030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--txt);background:#120c08;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--gold2)}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.btn{background:linear-gradient(#f0d27a,#c49431);color:#2a1a08;font-weight:800;padding:12px 16px;border-radius:12px;box-shadow:0 3px 0 #7a5a18}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a18}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.btn2{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:600}
.btn2:active{background:#3a2a1c}
.red{background:linear-gradient(#e86a5a,#a8302a);color:#fff;box-shadow:0 3px 0 #5e1712}
.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
h2{margin:4px 0 8px;font-size:18px;color:var(--gold)}
h3{margin:2px 0 6px;font-size:15px}
/* Đăng nhập */
#scrLogin{background:radial-gradient(ellipse at 50% 20%,#4a2a14,var(--bg) 70%);align-items:center;justify-content:center;padding:20px;overflow:auto}
.logo{font-size:38px;font-weight:800;letter-spacing:1px;text-align:center;background:linear-gradient(#fff2c0,#e8c45a 50%,#9a6a1a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 20px rgba(232,196,90,.25);margin-bottom:4px}
.box{width:100%;max-width:360px}
.tabs{display:flex;background:#120c08;border-radius:12px;padding:4px;margin:14px 0}
.tabs button{flex:1;padding:10px;border-radius:9px;background:none;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--card);color:var(--gold)}
.msg{min-height:20px;font-size:13px;color:#ff8a7a;text-align:center}
/* Khung chính */
header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#2b1d12,#1c140d);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header .nm{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:#120c08;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#1c140d;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:8px 2px 9px;color:var(--mut);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--gold)}
/* Tướng */
.lineup{display:flex;justify-content:space-around;align-items:flex-end;background:radial-gradient(ellipse at 50% 90%,#5a3a1c 0,transparent 70%);border-radius:14px;padding:6px 0 0;min-height:150px}
.lu{width:31%;text-align:center}
.fg{display:flex;justify-content:center}.fg svg{height:100%;width:auto}
.lu .fg{height:118px}
.lu .fg svg{height:100%;width:auto}
.lu .n{font-size:12px;font-weight:600}
.lu.empty .fg{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:30px;border:2px dashed var(--line);border-radius:12px;height:100px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 4px 6px;text-align:center;position:relative}
.hc .fg{height:88px}.hc .fg svg{height:100%}
.hc .n{font-size:11.5px;font-weight:700;line-height:1.2;min-height:28px;display:flex;align-items:center;justify-content:center}
.hc .s{font-size:11px;color:var(--mut)}
.hc .tag{position:absolute;top:4px;left:4px;background:var(--gold);color:#2a1a08;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
.r0{border-color:var(--r0)!important}.r1{border-color:var(--r1)!important}.r2{border-color:var(--r2)!important}.r3{border-color:var(--r3)!important;box-shadow:0 0 12px rgba(240,176,48,.35)}
.t0{color:var(--r0)}.t1{color:var(--r1)}.t2{color:var(--r2)}.t3{color:var(--r3)}
.star{color:#ffd34a;letter-spacing:-1px}
/* Bảng */
.lr{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
.lr:last-child{border:0}
.lr .rk{width:30px;text-align:center;font-weight:800;color:var(--mut)}
.lr .rk.top{color:var(--gold);font-size:18px}
.lr .who{flex:1;min-width:0}
.lr .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr.me{background:rgba(232,196,90,.1);border-radius:10px}
/* Hộp thoại */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#modal .mb{background:var(--bg2);border:1px solid var(--gold2);border-radius:16px;padding:16px;width:100%;max-width:400px;max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#000c;border:1px solid var(--gold2);padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90%;text-align:center;font-weight:600}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:70}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Chiến đấu */
#scrBattle{background:linear-gradient(#2a3a4a 0,#46525a 30%,#6b5a3a 31%,#4a3a22 100%)}
.bh{padding:calc(8px + env(safe-area-inset-top)) 12px 6px;display:flex;align-items:center;gap:8px;background:#0008}
.bh .t{flex:1;font-weight:800}
#field{position:relative;flex:1;overflow:hidden}
.unit{position:absolute;width:30%;transition:opacity .4s}
.unit .hd{font-size:11px;font-weight:700;text-align:center;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#0009;border-radius:4px;overflow:hidden;margin:2px 8%}
.bar i{display:block;height:100%;background:linear-gradient(#7ee08a,#2f9a48);transition:width .3s}
.foe .bar i{background:linear-gradient(#f08a7a,#b8382a)}
.bar.rg{height:4px}.bar.rg i{background:linear-gradient(#ffe27a,#e0a020)!important}
.unit .fig{height:min(17vh,130px);display:flex;justify-content:center}
.unit .fig .body{height:100%;transition:transform .16s ease-out;animation:breath 2.4s ease-in-out infinite}
.unit .fig svg{height:100%;width:auto;overflow:visible}
.foe .fig{transform:scaleX(-1)}
.unit.lunge .fig .body{transform:translateX(45%);animation:none}
.unit.hit .fig .body{animation:shake .25s}
.unit.hit .fig svg{filter:brightness(1.8) sepia(1) hue-rotate(-40deg) saturate(4)}
.unit.act .hd{color:var(--gold)}
.unit.act::after{content:'';position:absolute;left:25%;right:25%;bottom:-4px;height:8px;border-radius:50%;background:radial-gradient(var(--gold),transparent 70%)}
.unit.tgt::before{content:'▼';position:absolute;left:50%;top:-20px;margin-left:-9px;color:#ff4a3a;font-size:20px;text-shadow:0 0 6px #000;animation:bob .5s infinite alternate;z-index:3}
.unit.dead{opacity:.15}
@keyframes breath{50%{transform:translateY(-2px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{to{transform:translateY(6px)}}
.fl{position:absolute;font-weight:800;font-size:20px;text-shadow:0 2px 3px #000,0 0 2px #000;pointer-events:none;animation:fl 1s ease-out forwards;z-index:5;white-space:nowrap}
.fl.cr{font-size:26px;color:#ffd34a}
.fl.hl{color:#7ef08a}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-55px) scale(1);opacity:0}}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:28px;font-weight:800;color:var(--gold);text-shadow:0 0 18px #f80,0 3px 4px #000;opacity:0;pointer-events:none;z-index:6}
#banner.on{animation:bn 1.1s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(2)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#ctrl{background:#000a;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#ctrl .who{font-size:13px;color:var(--gold);text-align:center;min-height:18px}
.slash{position:absolute;width:30%;height:16vh;pointer-events:none;z-index:4;background:linear-gradient(115deg,transparent 42%,#fff 49%,#ffe9a0 51%,transparent 58%);animation:sl .3s ease-out forwards}
@keyframes sl{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:0;clip-path:inset(0 0 0 0)}}
.gres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gres .hc .fg{height:62px}
.gres .hc .n{font-size:10px;min-height:24px}
.flip{animation:flp .5s backwards}
@keyframes flp{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:8px;font-size:11px;padding:1px 6px;font-weight:700}
.adm{border-color:#7a3a3a}
</style>
</head>
<body>
<div id="loading"><div class="logo">Danh Tướng Lục</div><div class="spin"></div><div class="mut" id="loadTxt">Đang kết nối...</div></div>
<section class="scr" id="scrLogin">
<div class="box">
<div class="logo">Danh Tướng Lục</div>
<div class="mut" style="text-align:center">Chiêu mộ danh tướng – tranh bá thiên hạ</div>
<div class="tabs"><button class="on" data-t="in">Đăng nhập</button><button data-t="up">Đăng ký</button></div>

<input id="lgPass2" type="password" placeholder="Nhập lại mật khẩu" style="display:none">
<input id="lgName" placeholder="Tên nhân vật (hiện trong game)" maxlength="14" style="display:none">
<div class="mut" id="lgHint" style="display:none">Tên đăng nhập: 4–16 ký tự, chỉ gồm chữ thường không dấu, số và dấu gạch dưới. Mật khẩu: ít nhất 6 ký tự.</div>
<div class="msg" id="lgMsg"></div>
<button class="btn full" id="lgGo">Vào game</button>
<button class="btn2 full" id="btnInstall" style="display:none">📲 Cài game về điện thoại</button>
<div class="mut" id="iosHint" style="display:none;text-align:center">Trên iPhone: bấm nút Chia sẻ của Safari, chọn "Thêm vào MH chính" để cài game.</div>
</div>
</div>
</section>
<section class="scr" id="scrMain">
<header>
<div class="nm" id="hName"></div>
<span class="pill">⚔ <b id="hPow">0</b></span>
<span class="pill">💰 <b id="hGold">0</b></span>
<span class="pill">💎 <b id="hGem">0</b></span>
</header>
<div id="view"></div>
<nav>
<button data-v="sanh" class="on"><span class="ic">🏯</span>Sảnh</button>
<button data-v="tuong"><span class="ic">🛡</span>Tướng</button>
<button data-v="chieumo"><span class="ic">🎴</span>Chiêu mộ</button>
<button data-v="chiendau"><span class="ic">⚔</span>Chiến đấu</button>
<button data-v="xephang"><span class="ic">🏆</span>Xếp hạng</button>
</nav>
</section>
<section class="scr" id="scrBattle">
<div class="bh"><div class="t" id="bTitle"></div><span class="pill" id="bRound">Lượt 1</span></div>
<div id="field"><div id="banner"></div></div>
<div id="ctrl">
<div class="who" id="cWho"></div>
<div class="row">
<button class="btn" style="flex:1" id="cAtk">⚔ Đánh</button>
<button class="btn red" style="flex:1.4" id="cSkill">🔥 Tuyệt kỹ</button>
</div>
<div class="row">
<button class="btn2" style="flex:1" id="cAuto">🤖 Tự đánh: Tắt</button>
<button class="btn2" style="flex:1" id="cSpeed">⏩ Tốc độ x1</button>
</div>
</div>
</section>
<div id="modal"><div class="mb" id="mb"></div></div>
<div id="toast"></div>
<script type="module">

function stats(key,lv=1,star=1){
